<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumo ao Alvo 🎯🐢 — Metas de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg-0:#0A0A0A; --bg-1:#151210; --card:#171310;
    --line: rgba(212,175,55,0.24);
    --gold:#D4AF37; --gold-light:#F5D46A;
    --cream:#F2ECDA; --muted:#948C7C;
    --radius:18px;
    --font-display:'Fraunces', serif; --font-ui:'Space Grotesk', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; overflow-x:hidden;
    background:
      radial-gradient(700px 380px at 88% -6%, rgba(212,175,55,0.16), transparent 60%),
      radial-gradient(600px 340px at 6% 14%, rgba(212,175,55,0.08), transparent 55%),
      var(--bg-0);
    color:var(--cream); font-family:var(--font-ui); line-height:1.5;
  }
  :focus-visible{outline:2px solid var(--gold-light); outline-offset:2px;}
  .wrap{max-width:1000px; margin:0 auto; padding:32px 24px 70px; position:relative;}

  .orb{position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(245,212,106,0.5), rgba(212,175,55,0) 70%); filter:blur(2px); animation:float 7s ease-in-out infinite;}
  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  @media (prefers-reduced-motion: reduce){ .orb, .sparkle{animation:none !important;} }

  header{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:6px; position:relative;}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600; font-size:1.5rem;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--gold-light); box-shadow:0 0 12px 3px rgba(245,212,106,0.7); animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .code-badge{
    font-family:var(--font-mono); font-size:0.78rem; color:var(--gold-light);
    background:var(--bg-1); border:1px solid var(--line); border-radius:999px; padding:8px 16px;
    display:flex; align-items:center; gap:8px; letter-spacing:.06em;
  }
  .code-badge span.lbl{color:var(--muted); font-family:var(--font-ui); font-size:0.7rem; text-transform:uppercase; letter-spacing:.1em;}

  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:22px 0 18px;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    background:var(--bg-1); border:1px solid var(--line); color:var(--cream);
    font-family:var(--font-ui); font-size:0.9rem; padding:9px 12px; border-radius:10px;
    width:100%; min-width:0;
  }
  .btn-add{background:var(--bg-1); border:1px solid var(--line); color:var(--gold-light); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1.1rem; transition:transform .15s;}
  .btn-add:hover{transform:scale(1.08) rotate(90deg);}
  .new-seller-row{display:none; gap:8px; margin:10px 0 0;}
  .new-seller-row.show{display:flex;}

  .btn{font-family:var(--font-ui); font-weight:600; font-size:0.85rem; background:linear-gradient(135deg,var(--gold-light),var(--gold)); color:#1A1405; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; transition:transform .15s;}
  .btn:hover{transform:translateY(-2px);}

  .filters{display:flex; gap:12px; align-items:center; margin-bottom:22px; flex-wrap:wrap; background:var(--bg-1); border:1px solid var(--line); border-radius:999px; padding:10px 18px;}
  .filters label{font-family:var(--font-mono); font-size:0.68rem; letter-spacing:.08em; color:var(--muted); text-transform:uppercase;}
  .filters .sep{color:var(--muted); font-family:var(--font-mono); font-size:0.8rem;}

  .grid{display:grid; grid-template-columns:1fr 1.3fr; gap:20px; align-items:start;}
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; position:relative; overflow:hidden; min-width:0;}
  .card::after{content:''; position:absolute; inset:0; border-radius:var(--radius); box-shadow: inset 0 0 40px rgba(212,175,55,0.03); pointer-events:none;}

  .total{font-family:var(--font-mono); font-size:2.5rem; font-weight:700; color:var(--gold-light); margin:0 0 2px; text-shadow:0 0 22px rgba(245,212,106,0.25);}
  .total-cap{font-family:var(--font-mono); font-size:0.72rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin:0 0 20px;}

  .goal-row{margin-bottom:16px;}
  .goal-row .l{display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:6px;}
  .goal-row .amt{font-family:var(--font-mono); color:var(--gold-light);}
  .bar{height:10px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); box-shadow:0 0 10px rgba(245,212,106,0.5);}
  .bar-fill.super{background:linear-gradient(90deg,#6b6b6b,var(--gold-light));}

  .goals-form{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); min-width:0;}
  .goals-form label{font-size:0.75rem; color:var(--muted); display:block; margin-bottom:5px;}
  .goals-form .full{grid-column:1/-1;}
  .goals-form > div{min-width:0;}
  .goals-form input{font-size:1.05rem; padding:12px 12px; font-family:var(--font-mono); font-weight:700; color:var(--gold-light);}

  .entry-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin:16px 0 10px;}
  .entry-form > div{flex:1; min-width:120px;}
  .entry-form label{font-size:0.75rem; color:var(--muted); display:block; margin-bottom:5px;}

  .diary-field{margin-bottom:10px;}
  .diary-field label{font-size:0.75rem; color:var(--muted); display:block; margin-bottom:5px;}
  textarea{resize:vertical; min-height:44px;}

  canvas{max-height:210px; width:100% !important;}

  .history-row{padding:10px 0; border-bottom:1px dashed var(--line); font-family:var(--font-mono); font-size:0.88rem;}
  .history-row:last-child{border-bottom:none;}
  .history-row .top{display:flex; justify-content:space-between; align-items:center;}
  .history-row .d{color:var(--muted);}
  .history-row .v{color:var(--gold-light); font-weight:700;}
  .history-row button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.75rem; margin-left:12px;}
  .history-row button:hover{color:var(--gold-light);}
  .history-row .note{font-family:var(--font-ui); color:var(--muted); font-size:0.82rem; font-style:italic; margin-top:4px;}
  .empty{color:var(--muted); font-size:0.85rem; font-style:italic; padding:8px 0;}

  @media (max-width:600px){
    header{gap:12px;}
    .code-badge{width:100%; justify-content:center; flex-wrap:wrap; text-align:center;}
    .filters{flex-direction:column; align-items:stretch; border-radius:16px;}
    .filters .sep{display:none;}
    .goals-form{grid-template-columns:1fr;}
    .entry-form{flex-direction:column; align-items:stretch;}
    .entry-form > div{min-width:0;}
    .wrap{padding:24px 16px 50px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="orb" style="width:90px; height:90px; right:4%; top:-10px; animation-delay:0s;"></div>
  <div class="orb" style="width:46px; height:46px; right:22%; top:60px; animation-delay:1.4s;"></div>
  <div class="orb" style="width:30px; height:30px; left:2%; top:40px; animation-delay:.6s;"></div>

  <header>
    <div class="brand"><span class="dot"></span> Rumo ao Alvo 🎯🐢</div>
    <div class="code-badge"><span class="lbl" id="dayCodeLabel">código do dia</span> <span id="dayCode">520 741 8</span></div>
  </header>

  <div class="controls">
    <select id="sellerSelect"></select>
    <button class="btn-add" id="btnAddSeller" aria-label="Adicionar vendedor">+</button>
  </div>
  <div class="new-seller-row" id="newSellerRow">
    <input type="text" id="newSellerName" placeholder="Nome do vendedor">
    <button class="btn" id="confirmAddSeller">Adicionar</button>
  </div>

  <div class="filters">
    <label for="fromFilter">De</label>
    <input type="date" id="fromFilter">
    <span class="sep">→</span>
    <label for="toFilter">Até</label>
    <input type="date" id="toFilter">
  </div>

  <div class="grid">
    <div class="card">
      <p class="total" id="periodTotal">R$ 0,00</p>
      <p class="total-cap" id="periodLabel">—</p>

      <div class="goal-row">
        <div class="l"><span>Meta</span><span class="amt" id="metaAmt">R$ 0,00</span></div>
        <div class="bar"><div class="bar-fill" id="metaBar" style="width:0%"></div></div>
      </div>
      <div class="goal-row">
        <div class="l"><span>Super meta</span><span class="amt" id="superAmt">R$ 0,00</span></div>
        <div class="bar"><div class="bar-fill super" id="superBar" style="width:0%"></div></div>
      </div>

      <form class="goals-form" id="goalsForm">
        <div><label for="metaInput">Meta (R$)</label><input type="number" min="0" step="0.01" id="metaInput" required></div>
        <div><label for="superInput">Super meta (R$)</label><input type="number" min="0" step="0.01" id="superInput" required></div>
        <div class="full"><button type="submit" class="btn">Salvar metas</button></div>
      </form>
    </div>

    <div class="card">
      <canvas id="salesChart" height="210"></canvas>

      <form id="entryForm">
        <div class="entry-form">
          <div><label for="entryDate">Data</label><input type="date" id="entryDate" required></div>
          <div><label for="entryValue">Valor (R$)</label><input type="number" min="0" step="0.01" id="entryValue" placeholder="0,00" required></div>
          <div style="flex:0 0 auto;"><button type="submit" class="btn">Lançar</button></div>
        </div>
        <div class="diary-field">
          <label for="entryNote">Diário do dia</label>
          <textarea id="entryNote" placeholder="Como foi o dia? O que funcionou, o que quer repetir amanhã..."></textarea>
        </div>
      </form>

      <div id="historyList"></div>
    </div>
  </div>

</div>

<script>
(function(){
  const STORE_KEY = 'trilha_sellers_v2';
  const CUR_KEY = 'trilha_current_v1';

  const loadAll = ()=>{ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } };
  const saveAll = d => localStorage.setItem(STORE_KEY, JSON.stringify(d));

  let data = loadAll();
  let current = localStorage.getItem(CUR_KEY);
  if(!current || !data[current]) current = Object.keys(data)[0] || null;
  if(!current){ current = 'Vendedor 1'; data[current] = { meta:0, superMeta:0, days:{} }; saveAll(data); }
  localStorage.setItem(CUR_KEY, current);

  const fmt = n => (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  const todayISO = () => new Date().toISOString().slice(0,10);

  const sellerSelect = document.getElementById('sellerSelect');
  const newSellerRow = document.getElementById('newSellerRow');
  const newSellerName = document.getElementById('newSellerName');
  const fromFilter = document.getElementById('fromFilter');
  const toFilter = document.getElementById('toFilter');

  const year = new Date().getFullYear();
  fromFilter.value = year + '-01-01';
  toFilter.value = year + '-12-31';

  // código do dia — sorteado entre uma lista fixa, um por dia (decorativo/motivacional)
  const DAY_CODES = [
    { label:'Abundância financeira', code:'318 798' },
    { label:'Adiantamento de uma quantia em dinheiro', code:'914719318 916' },
    { label:'Aumentar as vendas', code:'54121381948' },
    { label:'Dinheiro inesperado', code:'520' },
    { label:'Fluxo de dinheiro real', code:'619 71421841' },
    { label:'Transformar tempo em dinheiro', code:'414 81 88' }
  ];
  function pickDayCode(){
    const seed = todayISO().split('-').join('');
    let n = 0; for(const c of seed) n = (n*31 + c.charCodeAt(0)) % 999999;
    return DAY_CODES[n % DAY_CODES.length];
  }
  const dc = pickDayCode();
  document.getElementById('dayCodeLabel').textContent = dc.label;
  document.getElementById('dayCode').textContent = dc.code;

  function normEntry(e){ return typeof e === 'number' ? {value:e, note:''} : (e || {value:0, note:''}); }

  function renderSellerSelect(){
    sellerSelect.innerHTML = '';
    Object.keys(data).forEach(name=>{
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if(name === current) opt.selected = true;
      sellerSelect.appendChild(opt);
    });
  }

  sellerSelect.addEventListener('change', e=>{
    current = e.target.value;
    localStorage.setItem(CUR_KEY, current);
    renderDashboard();
  });

  document.getElementById('btnAddSeller').addEventListener('click', ()=>{
    newSellerRow.classList.toggle('show');
    newSellerName.focus();
  });
  document.getElementById('confirmAddSeller').addEventListener('click', ()=>{
    const name = newSellerName.value.trim();
    if(!name) return;
    if(!data[name]) data[name] = { meta:0, superMeta:0, days:{} };
    saveAll(data);
    current = name;
    localStorage.setItem(CUR_KEY, current);
    newSellerName.value = '';
    newSellerRow.classList.remove('show');
    renderSellerSelect();
    renderDashboard();
  });

  fromFilter.addEventListener('change', renderDashboard);
  toFilter.addEventListener('change', renderDashboard);

  let chart;
  function renderDashboard(){
    const seller = data[current];
    const from = fromFilter.value, to = toFilter.value;
    document.getElementById('periodLabel').textContent =
      from.split('-').reverse().join('/') + ' até ' + to.split('-').reverse().join('/');

    const entries = Object.entries(seller.days)
      .filter(([date]) => date >= from && date <= to)
      .sort((a,b)=> a[0].localeCompare(b[0]))
      .map(([date,e]) => [date, normEntry(e)]);

    const total = entries.reduce((s,[,e])=> s+e.value, 0);
    document.getElementById('periodTotal').textContent = fmt(total);

    document.getElementById('metaAmt').textContent = fmt(seller.meta);
    document.getElementById('superAmt').textContent = fmt(seller.superMeta);
    document.getElementById('metaBar').style.width = seller.meta > 0 ? Math.min(100, total/seller.meta*100) + '%' : '0%';
    document.getElementById('superBar').style.width = seller.superMeta > 0 ? Math.min(100, total/seller.superMeta*100) + '%' : '0%';
    document.getElementById('metaInput').value = seller.meta || '';
    document.getElementById('superInput').value = seller.superMeta || '';

    const labels = entries.map(([date])=> date.slice(8,10)+'/'+date.slice(5,7));
    const values = entries.map(([,e])=> e.value);
    const ctx = document.getElementById('salesChart');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type:'bar',
      data:{ labels, datasets:[{ data: values, backgroundColor:'#D4AF37', borderRadius:6, maxBarThickness:22 }]},
      options:{
        responsive:true,
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => fmt(c.raw) } } },
        scales:{
          x:{ ticks:{ color:'#948C7C', font:{ family:'JetBrains Mono', size:10 }, maxRotation:0, autoSkip:true }, grid:{ display:false } },
          y:{ ticks:{ color:'#948C7C', font:{ family:'JetBrains Mono', size:10 } }, grid:{ color:'rgba(255,255,255,0.06)' } }
        }
      }
    });

    const list = document.getElementById('historyList');
    list.innerHTML = '';
    if(entries.length === 0){
      list.innerHTML = '<p class="empty">Nenhum lançamento no período.</p>';
    } else {
      entries.slice().reverse().forEach(([date, e])=>{
        const [yy,mm,dd] = date.split('-');
        const row = document.createElement('div');
        row.className = 'history-row';
        row.innerHTML = `<div class="top"><span class="d">${dd}/${mm}/${yy}</span><span><span class="v">${fmt(e.value)}</span><button data-date="${date}">remover</button></span></div>` +
          (e.note ? `<div class="note">"${e.note}"</div>` : '');
        list.appendChild(row);
      });
      list.querySelectorAll('button[data-date]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          delete data[current].days[btn.dataset.date];
          saveAll(data);
          renderDashboard();
        });
      });
    }
  }

  document.getElementById('goalsForm').addEventListener('submit', e=>{
    e.preventDefault();
    data[current].meta = parseFloat(document.getElementById('metaInput').value) || 0;
    data[current].superMeta = parseFloat(document.getElementById('superInput').value) || 0;
    saveAll(data);
    renderDashboard();
  });

  document.getElementById('entryForm').addEventListener('submit', e=>{
    e.preventDefault();
    const date = document.getElementById('entryDate').value || todayISO();
    const val = parseFloat(document.getElementById('entryValue').value);
    const note = document.getElementById('entryNote').value.trim();
    if(!val && val !== 0) return;
    const seller = data[current];
    const existing = normEntry(seller.days[date]);
    seller.days[date] = { value: existing.value + val, note: note || existing.note };
    saveAll(data);
    document.getElementById('entryValue').value = '';
    document.getElementById('entryNote').value = '';
    if(date < fromFilter.value) fromFilter.value = date;
    if(date > toFilter.value) toFilter.value = date;
    renderDashboard();
  });

  document.getElementById('entryDate').value = todayISO();

  renderSellerSelect();
  renderDashboard();
})();
</script>
</body>
</html>
